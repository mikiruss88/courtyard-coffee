<div class="customer-form" id="customer-form">
  <label>Your Name</label>
  <input type="text" id="c-name" placeholder="e.g. Aoife">

  <label>Phone / Email</label>
  <input type="text" id="c-contact" placeholder="For order updates">

  <label>Order Type</label>
  <select id="c-type" onchange="handleOrderType()">
    <option value="">— Select —</option>
    <option value="sit-in">Sit In</option>
    <option value="pickup">Collection / Pick Up</option>
    <option value="delivery">Delivery</option>
  </select>

  <!-- PICKUP -->
  <div id="pickup-fields" style="display:none;">
    <label>Collection Date</label>
    <input type="date" id="c-pickup-date">

    <label>Intended Arrival Time</label>
    <input type="time" id="c-arrival">

    <div class="form-hint">
      Tell us when you plan to arrive and we'll aim to have everything ready.
    </div>
  </div>

  <!-- DELIVERY -->
  <div id="delivery-fields" style="display:none;">
    <label>Delivery Address</label>
    <input type="text" id="c-address" placeholder="Street, Town, Eircode">

    <label>Eircode</label>
    <input type="text" id="c-eircode" placeholder="A92 XXXX">

    <label>Requested Delivery Time</label>
    <input type="time" id="c-delivery-time">

    <label>Delivery Instructions</label>
    <textarea id="c-delivery-notes"
      placeholder="Apartment number, gate code, leave with reception etc."></textarea>

    <div class="form-hint">
      We'll do our best to deliver at your preferred time.
    </div>
  </div>

  <label>Special Notes</label>
  <textarea id="c-notes" placeholder="Allergies, preferences…"></textarea>
</div>
