<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courtyard Coffee — Order Online</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f0e8;
    --dark: #1a1410;
    --brown: #4a2e1a;
    --gold: #c8962a;
    --warm: #e8dcc8;
    --soft: #d4c4a8;
    --text: #2d1f10;
    --muted: #7a6550;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--cream);
    color: var(--text);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--dark);
    color: var(--cream);
    text-align: center;
    padding: 3rem 1rem 2.5rem;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(200,150,42,0.18) 0%, transparent 70%);
  }
  .logo-arch {
    width: 80px;
    height: 60px;
    margin: 0 auto 1rem;
    position: relative;
    z-index: 1;
  }
  .logo-arch svg { width: 100%; height: 100%; }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 900;
    letter-spacing: 0.08em;
    position: relative;
    z-index: 1;
  }
  header p {
    font-size: 0.75rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold);
    margin-top: 0.4rem;
    position: relative;
    z-index: 1;
  }

  /* LAYOUT */
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 1.5rem;
  }

  .main-grid {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 2.5rem;
    padding: 3rem 0 4rem;
    align-items: start;
  }
  @media (max-width: 780px) {
    .main-grid { grid-template-columns: 1fr; }
  }

  /* SECTION TITLES */
  .section-label {
    font-size: 0.65rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1.2rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--soft);
  }

  .category-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--brown);
    margin: 2.5rem 0 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--soft);
  }
  .category-title:first-of-type { margin-top: 0; }

  /* MENU ITEMS */
  .menu-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.85rem 1rem;
    border-radius: 8px;
    margin-bottom: 0.5rem;
    cursor: pointer;
    transition: background 0.18s, transform 0.12s;
    gap: 1rem;
    background: white;
    border: 1.5px solid transparent;
  }
  .menu-item:hover {
    background: var(--warm);
    border-color: var(--soft);
    transform: translateX(3px);
  }
  .menu-item.in-cart {
    border-color: var(--gold);
    background: #fdf8ee;
  }

  .item-info { flex: 1; }
  .item-name {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
  }
  .item-sub {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 0.15rem;
    letter-spacing: 0.02em;
  }

  .item-right {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-shrink: 0;
  }
  .item-price {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--brown);
    min-width: 50px;
    text-align: right;
  }

  .qty-ctrl {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .qty-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--soft);
    background: white;
    font-size: 1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--brown);
    transition: background 0.15s, border-color 0.15s;
    flex-shrink: 0;
    font-weight: 500;
  }
  .qty-btn:hover { background: var(--gold); border-color: var(--gold); color: white; }
  .qty-num {
    min-width: 20px;
    text-align: center;
    font-weight: 500;
    font-size: 0.95rem;
    color: var(--text);
  }

  /* extras note */
  .extras-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
  }
  .extra-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 0.8rem;
    background: white;
    border-radius: 6px;
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    font-size: 0.85rem;
  }
  .extra-item:hover { background: var(--warm); }
  .extra-item.selected { border-color: var(--gold); background: #fdf8ee; }
  .extra-item input[type="checkbox"] { accent-color: var(--gold); width: 15px; height: 15px; cursor: pointer; }
  .extra-name { flex: 1; color: var(--text); font-weight: 400; }
  .extra-price { color: var(--muted); font-size: 0.78rem; }

  /* ORDER SIDEBAR */
  .order-panel {
    background: var(--dark);
    color: var(--cream);
    border-radius: 14px;
    padding: 2rem 1.5rem;
    position: sticky;
    top: 1.5rem;
  }
  .order-panel h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    margin-bottom: 1.5rem;
    padding-bottom: 0.8rem;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .order-badge {
    background: var(--gold);
    color: var(--dark);
    font-size: 0.75rem;
    font-family: 'Jost', sans-serif;
    font-weight: 500;
    border-radius: 20px;
    padding: 0.15rem 0.6rem;
    min-width: 24px;
    text-align: center;
    display: none;
  }
  .order-badge.visible { display: inline-block; }

  .cart-items { min-height: 80px; }
  .cart-empty {
    text-align: center;
    padding: 2rem 1rem;
    color: rgba(245,240,232,0.4);
    font-size: 0.9rem;
  }
  .cart-empty span { display: block; font-size: 2rem; margin-bottom: 0.5rem; }

  .cart-line {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 0.6rem 0;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    font-size: 0.88rem;
    gap: 0.5rem;
  }
  .cart-line-name { flex: 1; color: var(--cream); line-height: 1.3; }
  .cart-line-name small { display: block; color: rgba(245,240,232,0.5); font-size: 0.75rem; margin-top: 0.1rem; }
  .cart-line-price { color: var(--gold); font-weight: 500; flex-shrink: 0; }

  .cart-extras-summary {
    padding: 0.6rem 0;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    font-size: 0.82rem;
    color: rgba(245,240,232,0.6);
  }

  .cart-total {
    display: flex;
    justify-content: space-between;
    margin-top: 1.2rem;
    padding-top: 0.8rem;
    border-top: 1px solid rgba(255,255,255,0.2);
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
  }
  .cart-total .t-price { color: var(--gold); font-weight: 700; }

  /* Customer details */
  .customer-form { margin-top: 1.5rem; }
  .customer-form label {
    display: block;
    font-size: 0.68rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(245,240,232,0.5);
    margin-bottom: 0.35rem;
    margin-top: 0.9rem;
  }
  .customer-form label:first-child { margin-top: 0; }
  .customer-form input, .customer-form textarea, .customer-form select {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    padding: 0.6rem 0.8rem;
    color: var(--cream);
    font-family: 'Jost', sans-serif;
    font-size: 0.88rem;
    outline: none;
    transition: border-color 0.15s;
  }
  .customer-form input:focus, .customer-form textarea:focus, .customer-form select:focus {
    border-color: var(--gold);
  }
  .customer-form select option { background: var(--dark); }
  .customer-form textarea { resize: vertical; min-height: 60px; }

  .order-btn {
    width: 100%;
    margin-top: 1.4rem;
    padding: 0.95rem;
    background: var(--gold);
    color: var(--dark);
    border: none;
    border-radius: 8px;
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: opacity 0.15s, transform 0.1s;
  }
  .order-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .order-btn:disabled { opacity: 0.4; cursor: default; transform: none; }

  /* SUCCESS */
  .success-msg {
    display: none;
    text-align: center;
    padding: 2rem 1rem;
    animation: fadeIn 0.4s ease;
  }
  .success-msg span { font-size: 2.5rem; display: block; margin-bottom: 0.8rem; }
  .success-msg h3 { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--gold); margin-bottom: 0.5rem; }
  .success-msg p { font-size: 0.85rem; color: rgba(245,240,232,0.6); line-height: 1.6; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* Divider */
  hr.divider {
    border: none;
    border-top: 1px solid var(--soft);
    margin: 2rem 0 1.5rem;
  }

  @media (max-width: 500px) {
    .extras-grid { grid-template-columns: 1fr; }
    .menu-item { padding: 0.7rem 0.8rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-arch">
    <svg viewBox="0 0 80 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- arch -->
      <rect x="2" y="10" width="10" height="8" rx="1" stroke="#c8962a" stroke-width="1.5" fill="none"/>
      <rect x="2" y="20" width="10" height="8" rx="1" stroke="#c8962a" stroke-width="1.5" fill="none"/>
      <rect x="2" y="30" width="10" height="8" rx="1" stroke="#c8962a" stroke-width="1.5" fill="none"/>
      <rect x="14" y="4" width="10" height="8" rx="1" stroke="#c8962a" stroke-width="1.5" fill="none"/>
      <rect x="26" y="0" width="10" height="7" rx="1" stroke="#c8962a" stroke-width="1.5" fill="none"/>
      <rect x="38" y="0" width="10" height="7" rx="1" stroke="#c8962a" stroke-width="1.5" fill="none"/>
      <rect x="50" y="0" width="10" height="7" rx="1" stroke="#c8962a" stroke-width="1.5" fill="none"/>
      <rect x="62" y="4" width="10" height="8" rx="1" stroke="#c8962a" stroke-width="1.5" fill="none"/>
      <rect x="68" y="10" width="10" height="8" rx="1" stroke="#c8962a" stroke-width="1.5" fill="none"/>
      <rect x="68" y="20" width="10" height="8" rx="1" stroke="#c8962a" stroke-width="1.5" fill="none"/>
      <rect x="68" y="30" width="10" height="8" rx="1" stroke="#c8962a" stroke-width="1.5" fill="none"/>
      <path d="M12 38 Q12 18 40 10 Q68 18 68 38" stroke="#c8962a" stroke-width="1.5" fill="none"/>
      <!-- cup -->
      <path d="M32 44 L35 54 L45 54 L48 44 Z" stroke="#c8962a" stroke-width="1.2" fill="none"/>
      <path d="M34 54 L33 57 L47 57 L46 54" stroke="#c8962a" stroke-width="1.2" fill="none"/>
      <path d="M37 42 Q37 39 40 39 Q43 39 43 42" stroke="#c8962a" stroke-width="1.2" fill="none"/>
    </svg>
  </div>
  <h1>Courtyard Coffee</h1>
  <p>Drogheda &nbsp;·&nbsp; Order Online</p>
</header>

<div class="container">
  <div class="main-grid">

    <!-- MENU COLUMN -->
    <div class="menu-col">

      <!-- COFFEE -->
      <div class="section-label">Hot Coffee</div>
      <div id="menu-hot-coffee"></div>

      <!-- ICED -->
      <div class="category-title">Iced</div>
      <div id="menu-iced"></div>

      <!-- TEA & OTHER DRINKS -->
      <div class="category-title">Tea &amp; Other Drinks</div>
      <div id="menu-drinks"></div>

      <!-- SWEET TREATS -->
      <div class="category-title">Sweet Treats &amp; Snacks</div>
      <div id="menu-treats"></div>

      <hr class="divider">

      <!-- EXTRAS -->
      <div class="section-label">Extras — Add to your order</div>
      <div class="extras-grid" id="extras-grid"></div>

    </div>

    <!-- ORDER SIDEBAR -->
    <div>
      <div class="order-panel" id="order-panel">
        <h2>
          Your Order
          <span class="order-badge" id="order-badge">0</span>
        </h2>

        <div id="cart-body">
          <div class="cart-items" id="cart-items">
            <div class="cart-empty" id="cart-empty">
              <span>☕</span>
              Nothing added yet — tap any item to add it
            </div>
          </div>

          <div id="cart-extras-row" style="display:none;" class="cart-extras-summary"></div>

          <div class="cart-total" id="cart-total" style="display:none;">
            <span>Total</span>
            <span class="t-price" id="cart-total-price">€0.00</span>
          </div>

          <div class="customer-form" id="customer-form">
            <label>Your Name</label>
            <input type="text" id="c-name" placeholder="e.g. Aoife">
            <label>Phone / Email</label>
            <input type="text" id="c-contact" placeholder="For order updates">
            <label>Order Type</label>
            <select id="c-type">
              <option value="takeaway">Takeaway</option>
              <option value="sit-in">Sit In</option>
            </select>
            <label>Special Notes</label>
            <textarea id="c-notes" placeholder="Allergies, preferences…"></textarea>
          </div>

          <button class="order-btn" id="place-order-btn" disabled>Place Order</button>
        </div>

        <div class="success-msg" id="success-msg">
          <span>🎉</span>
          <h3>Order Received!</h3>
          <p>Thanks, <strong id="success-name"></strong>! We'll have your order ready shortly. See you at Courtyard Coffee!</p>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const hotCoffee = [
  { id: 'espresso',    name: 'Espresso',    price: 2.50 },
  { id: 'americano',   name: 'Americano',   price: 2.70, sub: 'Small / Medium — select size in notes', altPrice: 2.90 },
  { id: 'flatwhite',   name: 'Flat White',  price: 3.20 },
  { id: 'cappuccino',  name: 'Cappuccino',  price: 3.20 },
  { id: 'latte',       name: 'Latte',       price: 3.20 },
  { id: 'mocha',       name: 'Mocha',       price: 3.70 },
];

const icedItems = [
  { id: 'iced-latte',  name: 'Iced Latte',  price: 3.50 },
  { id: 'iced-tea',    name: 'Iced Tea',     price: 3.50, sub: 'Lemon or Peach — add preference in notes' },
];

const drinks = [
  { id: 'tea',         name: 'Tea',          price: 2.60 },
  { id: 'herbal-tea',  name: 'Herbal Tea',   price: 2.60 },
  { id: 'hot-choc',    name: 'Hot Chocolate',price: 3.50 },
  { id: 'babychino',   name: 'Babychino',    price: 2.00 },
  { id: 'puppachino',  name: 'Puppachino',   price: 1.00, sub: 'For your furry friend 🐾' },
  { id: 'soft-drink',  name: 'Soft Drink',   price: 1.50 },
  { id: 'water',       name: 'Water',        price: 1.50 },
  { id: 'juice',       name: 'Juice',        price: 1.00 },
];

const treats = [
  { id: 'pastry',      name: 'Pastry',       price: 2.50 },
  { id: 'protein-ball',name: 'Protein Ball', price: 2.00 },
  { id: 'bar',         name: 'Bar',          price: 1.50 },
  { id: 'pringles',    name: 'Pringles',     price: 1.50 },
];

const extras = [
  { id: 'x-shot',      name: 'Extra Shot',       price: 0.50 },
  { id: 'x-syrup',     name: 'Syrup',            price: 0.30 },
  { id: 'x-altmilk',   name: 'Alternative Milk', price: 0.50 },
  { id: 'x-cream',     name: 'Cream',            price: 0.30 },
];

// ── STATE ─────────────────────────────────────────────────────────────────────
const cart = {};         // id → qty
const selectedExtras = new Set();

// ── RENDER HELPERS ─────────────────────────────────────────────────────────────
function fmt(n) { return '€' + n.toFixed(2); }

function renderSection(containerId, items) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'menu-item';
    div.id = 'item-' + item.id;
    const qty = cart[item.id] || 0;
    div.innerHTML = `
      <div class="item-info">
        <div class="item-name">${item.name}</div>
        ${item.sub ? `<div class="item-sub">${item.sub}</div>` : ''}
      </div>
      <div class="item-right">
        <div class="item-price">${fmt(item.price)}</div>
        <div class="qty-ctrl">
          <button class="qty-btn" data-id="${item.id}" data-action="dec">−</button>
          <span class="qty-num" id="qty-${item.id}">${qty}</span>
          <button class="qty-btn" data-id="${item.id}" data-action="inc">+</button>
        </div>
      </div>`;
    el.appendChild(div);
  });
}

function renderExtras() {
  const el = document.getElementById('extras-grid');
  el.innerHTML = '';
  extras.forEach(e => {
    const div = document.createElement('label');
    div.className = 'extra-item' + (selectedExtras.has(e.id) ? ' selected' : '');
    div.innerHTML = `
      <input type="checkbox" data-extra="${e.id}" ${selectedExtras.has(e.id) ? 'checked' : ''}>
      <span class="extra-name">${e.name}</span>
      <span class="extra-price">+${fmt(e.price)}</span>`;
    el.appendChild(div);
  });
}

// ── UPDATE CART ────────────────────────────────────────────────────────────────
function updateCart() {
  const allItems = [...hotCoffee, ...icedItems, ...drinks, ...treats];
  const itemMap = {};
  allItems.forEach(i => { itemMap[i.id] = i; });

  // Update qty displays & item highlight
  allItems.forEach(item => {
    const qty = cart[item.id] || 0;
    const qtyEl = document.getElementById('qty-' + item.id);
    const rowEl = document.getElementById('item-' + item.id);
    if (qtyEl) qtyEl.textContent = qty;
    if (rowEl) rowEl.classList.toggle('in-cart', qty > 0);
  });

  // Build cart lines
  const cartItemsEl = document.getElementById('cart-items');
  const cartEmptyEl = document.getElementById('cart-empty');
  const cartTotalEl = document.getElementById('cart-total');
  const cartTotalPrice = document.getElementById('cart-total-price');
  const cartExtrasRow = document.getElementById('cart-extras-row');
  const badge = document.getElementById('order-badge');
  const btn = document.getElementById('place-order-btn');

  const lines = Object.entries(cart).filter(([,q]) => q > 0);
  let total = 0;
  let totalQty = 0;

  // Remove old cart lines (not empty msg)
  cartItemsEl.querySelectorAll('.cart-line').forEach(el => el.remove());

  if (lines.length === 0) {
    cartEmptyEl.style.display = '';
  } else {
    cartEmptyEl.style.display = 'none';
    lines.forEach(([id, qty]) => {
      const item = itemMap[id];
      if (!item) return;
      const lineTotal = item.price * qty;
      total += lineTotal;
      totalQty += qty;
      const line = document.createElement('div');
      line.className = 'cart-line';
      line.innerHTML = `
        <div class="cart-line-name">${item.name}<small>×${qty}</small></div>
        <div class="cart-line-price">${fmt(lineTotal)}</div>`;
      cartItemsEl.appendChild(line);
    });
  }

  // Extras summary
  let extraTotal = 0;
  const extraNames = [];
  selectedExtras.forEach(eid => {
    const ex = extras.find(e => e.id === eid);
    if (ex) { extraTotal += ex.price; extraNames.push(ex.name); }
  });
  if (selectedExtras.size > 0 && lines.length > 0) {
    cartExtrasRow.style.display = '';
    cartExtrasRow.textContent = 'Extras: ' + extraNames.join(', ') + ' (+' + fmt(extraTotal) + ')';
    total += extraTotal;
  } else {
    cartExtrasRow.style.display = 'none';
  }

  if (lines.length > 0) {
    cartTotalEl.style.display = '';
    cartTotalPrice.textContent = fmt(total);
  } else {
    cartTotalEl.style.display = 'none';
  }

  badge.textContent = totalQty;
  badge.classList.toggle('visible', totalQty > 0);
  btn.disabled = lines.length === 0;
}

// ── EVENT DELEGATION ───────────────────────────────────────────────────────────
document.addEventListener('click', e => {
  const btn = e.target.closest('.qty-btn');
  if (btn) {
    const id = btn.dataset.id;
    const action = btn.dataset.action;
    if (action === 'inc') {
      cart[id] = (cart[id] || 0) + 1;
    } else {
      if (cart[id] > 0) cart[id]--;
    }
    updateCart();
    return;
  }
});

document.addEventListener('change', e => {
  const cb = e.target.closest('[data-extra]');
  if (cb) {
    const eid = cb.dataset.extra;
    if (cb.checked) selectedExtras.add(eid);
    else selectedExtras.delete(eid);
    // re-render label highlight
    const label = cb.closest('.extra-item');
    if (label) label.classList.toggle('selected', cb.checked);
    updateCart();
  }
});

// ── PLACE ORDER ────────────────────────────────────────────────────────────────
document.getElementById('place-order-btn').addEventListener('click', () => {
  const name = document.getElementById('c-name').value.trim() || 'Customer';
  const contact = document.getElementById('c-contact').value.trim();
  const type = document.getElementById('c-type').value;
  const notes = document.getElementById('c-notes').value.trim();

  // Build order summary (you could POST this to your backend)
  const allItems = [...hotCoffee, ...icedItems, ...drinks, ...treats];
  const itemMap = {};
  allItems.forEach(i => { itemMap[i.id] = i; });

  const orderLines = Object.entries(cart)
    .filter(([,q]) => q > 0)
    .map(([id, qty]) => `${itemMap[id]?.name} ×${qty}`);

  const extraNames = [...selectedExtras].map(eid => extras.find(e => e.id === eid)?.name).filter(Boolean);

  const orderData = {
    name, contact, type, notes,
    items: orderLines,
    extras: extraNames,
    timestamp: new Date().toISOString()
  };

  console.log('ORDER SUBMITTED:', orderData);
  // ↑ Replace the console.log with your actual backend call, e.g.:
  // fetch('/api/orders', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(orderData) })

  document.getElementById('success-name').textContent = name;
  document.getElementById('cart-body').style.display = 'none';
  document.getElementById('success-msg').style.display = 'block';
});

// ── INIT ──────────────────────────────────────────────────────────────────────
renderSection('menu-hot-coffee', hotCoffee);
renderSection('menu-iced', icedItems);
renderSection('menu-drinks', drinks);
renderSection('menu-treats', treats);
renderExtras();
updateCart();
</script>
</body>
</html>
